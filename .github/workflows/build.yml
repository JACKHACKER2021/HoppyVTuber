name: Build APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APKs (VTuber + Mazlíček)
        run: gradle assembleVtuberRelease assemblePetRelease --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/vtuber/release/app-vtuber-release.apk HoppyVTuber.apk
          cp app/build/outputs/apk/pet/release/app-pet-release.apk HoppyMazlicek.apk

      - name: Upload VTuber APK
        uses: actions/upload-artifact@v4
        with:
          name: HoppyVTuber-release-apk
          path: HoppyVTuber.apk

      - name: Upload Pet APK
        uses: actions/upload-artifact@v4
        with:
          name: HoppyMazlicek-release-apk
          path: HoppyMazlicek.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Hoppy VTuber v2.0 (Build ${{ github.run_number }})
          body: |
            ## Hoppy VTuber v2.0 (Nový čistý build od nuly)
            - Kompletně nová stavba aplikace
            - Přidány chybějící ikony aplikace (@mipmap/ic_launcher, adaptive icon pro Android 8-16)
            - Optimalizace pro 64-bit procesory ARM64 (arm64-v8a)
            - Podepsáno v1 + v2 + v3 schématy
          files: |
            HoppyVTuber.apk
            HoppyMazlicek.apk
